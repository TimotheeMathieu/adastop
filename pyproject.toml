[project]
name = "adastop"
version = "0.1.3"
description = "AdaStop implements a *statistical test to adaptively choose the number of runs of stochastic algorithms* necessary to compare these algorithms and be able to rank them with a theoretically controlled family-wise error rate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=7.0",
    "matplotlib>=3.9",
    "numpy>=1.23.2",
    "pandas>=1.5.0",
    "scipy>=1.9.2",
    "tabulate>=0.8.9",
]

[project.scripts]
adastop = "adastop.cli:adastop"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>6.2.5",
]
